name: CI — Lint & Import Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Python syntax & import check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile bot.py config.py
          python -m py_compile src/logger.py src/prompt_builder.py src/validator.py src/builder.py src/views.py src/commands.py
          echo "✅ All files compiled without syntax errors"

      - name: Optional flake8 style check
        continue-on-error: true
        run: |
          pip install flake8 --quiet
          flake8 . --max-line-length=120 --exclude=.git,__pycache__,.venv,venv
